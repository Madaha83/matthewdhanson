<section id="contact">
  <div class="container">
    <h2>Contact</h2>
    <p class="lead">Best way to reach me is email. I’m open to roles in assessment development, people analytics, and applied research—especially where science meets product.</p>
    <div class="card">
      <form id="contactForm" class="grid cols-2" name="contact" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="contact" />
        <div class="row" style="gap:12px; flex-wrap:nowrap">
          <input name="name" aria-label="Your name" placeholder="Your name" required style="flex:1; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text)" />
          <input name="email" aria-label="Your email" placeholder="you@email.com" type="email" required style="flex:1; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text)" />
        </div>
        <textarea name="message" aria-label="Message" placeholder="How can I help?" rows="5" required style="grid-column:1/-1; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text)"></textarea>
        <div class="row">
          <button class="btn primary" type="submit">Send</button>
          <a class="btn" href="mailto:matthew.d.hanson@outlook.com">Or email directly</a>
        </div>
      </form>
    </div>
  </div>
</section>
